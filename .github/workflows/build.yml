name: Build, test, and publish

on:
  push:
    branches: ["main"]
  pull_request:
  release:
    types: ["published"]

permissions:
  actions: read
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GO_VERSION: "1.26.6"
  NODE_VERSION: "24"
  UV_VERSION: "0.12.0"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install WebUI dependencies
        working-directory: webui
        run: npm ci

      - name: Check WebUI
        working-directory: webui
        run: npm run check

      - name: Test Go
        run: go test ./...

      - name: Test concurrent state
        run: go test -race ./internal/recipes ./internal/benchmark ./internal/catalog ./internal/proxy ./internal/vllm ./internal/portalloc ./internal/backendendpoint ./internal/native ./internal/kobold

      - name: Check Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  build:
    name: Build ${{ matrix.target.name }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: linux-amd64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
            binary: tensors-router-linux-amd64
            webui_binary: tensor-router-webui-linux-amd64
            downloader_binary: tensor-router-downloader-linux-amd64
            vllm_binary: tensor-router-vllm-linux-amd64
            archive: tensors-router-linux-amd64.tar.gz
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            binary: tensors-router-linux-arm64
            webui_binary: tensor-router-webui-linux-arm64
            downloader_binary: tensor-router-downloader-linux-arm64
            vllm_binary: tensor-router-vllm-linux-arm64
            archive: tensors-router-linux-arm64.tar.gz
          - name: linux-armv7
            runner: ubuntu-latest
            goos: linux
            goarch: arm
            goarm: "7"
            binary: tensors-router-linux-armv7
            webui_binary: tensor-router-webui-linux-armv7
            downloader_binary: tensor-router-downloader-linux-armv7
            archive: tensors-router-linux-armv7.tar.gz
          - name: windows-amd64
            runner: ubuntu-latest
            goos: windows
            goarch: amd64
            binary: tensors-router-windows-amd64.exe
            webui_binary: tensor-router-webui-windows-amd64.exe
            downloader_binary: tensor-router-downloader-windows-amd64.exe
            archive: tensors-router-windows-amd64.zip
          - name: windows-arm64
            runner: ubuntu-latest
            goos: windows
            goarch: arm64
            binary: tensors-router-windows-arm64.exe
            webui_binary: tensor-router-webui-windows-arm64.exe
            downloader_binary: tensor-router-downloader-windows-arm64.exe
            archive: tensors-router-windows-arm64.zip
          - name: macos-arm64
            runner: macos-15
            goos: darwin
            goarch: arm64
            binary: tensors-router-darwin-arm64
            webui_binary: tensor-router-webui-darwin-arm64
            downloader_binary: tensor-router-downloader-darwin-arm64
            vllm_binary: tensor-router-vllm-darwin-arm64
            archive: tensors-router-darwin-arm64.tar.gz
    runs-on: ${{ matrix.target.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Verify vLLM native runner
        if: matrix.target.name == 'linux-amd64' || matrix.target.name == 'linux-arm64' || matrix.target.name == 'macos-arm64'
        env:
          EXPECTED_OS: ${{ matrix.target.goos }}
          EXPECTED_ARCH: ${{ matrix.target.goarch }}
        run: |
          case "$(uname -s)" in
            Linux) HOST_OS=linux ;;
            Darwin) HOST_OS=darwin ;;
            *) HOST_OS=unsupported ;;
          esac
          case "$(uname -m)" in
            x86_64) HOST_ARCH=amd64 ;;
            arm64|aarch64) HOST_ARCH=arm64 ;;
            *) HOST_ARCH=unsupported ;;
          esac
          test "$HOST_OS/$HOST_ARCH" = "$EXPECTED_OS/$EXPECTED_ARCH"

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Set up pinned uv bootstrap
        if: matrix.target.name == 'linux-amd64' || matrix.target.name == 'linux-arm64' || matrix.target.name == 'macos-arm64'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Stage embedded uv bootstrap
        if: matrix.target.name == 'linux-amd64' || matrix.target.name == 'linux-arm64' || matrix.target.name == 'macos-arm64'
        run: |
          test "$(uv --version | awk '{print $2}')" = "$UV_VERSION"
          mkdir -p internal/vllm/assets
          cp -L "$(command -v uv)" internal/vllm/assets/uv

      - name: Install WebUI dependencies
        working-directory: webui
        run: npm ci

      - name: Build WebUI assets
        working-directory: webui
        run: npm run build

      - name: Test native vLLM companion
        if: matrix.target.name == 'linux-amd64' || matrix.target.name == 'linux-arm64' || matrix.target.name == 'macos-arm64'
        run: go test -tags vllm_embedded_uv ./internal/vllm ./cmd/tensor-router-vllm

      - name: Build executables
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
          CGO_ENABLED: "0"
          TARGET_GOARM: ${{ matrix.target.goarm }}
          OUTPUT: dist/${{ matrix.target.binary }}
          WEBUI_OUTPUT: dist/${{ matrix.target.webui_binary }}
          DOWNLOADER_OUTPUT: dist/${{ matrix.target.downloader_binary }}
          VLLM_OUTPUT: dist/${{ matrix.target.vllm_binary }}
          VERSION: ${{ github.event.release.tag_name || github.sha }}
        run: |
          mkdir -p dist
          if [ -n "$TARGET_GOARM" ]; then
            export GOARM="$TARGET_GOARM"
          fi
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-s -w -X tensors-router/internal/buildinfo.Version=$VERSION -X tensors-router/internal/buildinfo.Commit=$GITHUB_SHA -X tensors-router/internal/buildinfo.Date=$BUILD_DATE"
          go build -buildvcs=false -trimpath -ldflags "$LDFLAGS" -o "$OUTPUT" ./cmd/tensors-router
          go build -buildvcs=false -trimpath -ldflags "$LDFLAGS" -o "$WEBUI_OUTPUT" ./cmd/tensor-router-webui
          if [ -n "${{ matrix.target.downloader_binary }}" ]; then
            go build -buildvcs=false -trimpath -ldflags "$LDFLAGS" -o "$DOWNLOADER_OUTPUT" ./cmd/tensor-router-downloader
          fi
          if [ -n "${{ matrix.target.vllm_binary }}" ]; then
            go build -tags vllm_embedded_uv -buildvcs=false -trimpath -ldflags "$LDFLAGS" -o "$VLLM_OUTPUT" ./cmd/tensor-router-vllm
            "$VLLM_OUTPUT" bootstrap-info | grep -Eq '^uv sha256:[0-9a-f]{64}$'
          fi

      - name: Package executables
        env:
          GOOS: ${{ matrix.target.goos }}
          BINARY: ${{ matrix.target.binary }}
          WEBUI_BINARY: ${{ matrix.target.webui_binary }}
          DOWNLOADER_BINARY: ${{ matrix.target.downloader_binary }}
          VLLM_BINARY: ${{ matrix.target.vllm_binary }}
          ARCHIVE: ${{ matrix.target.archive }}
        run: |
          FILES=("$BINARY" "$WEBUI_BINARY")
          if [ -n "$DOWNLOADER_BINARY" ]; then
            FILES+=("$DOWNLOADER_BINARY")
          fi
          if [ -n "$VLLM_BINARY" ]; then
            FILES+=("$VLLM_BINARY")
          fi
          chmod +x "${FILES[@]/#/dist/}"
          if [ "$GOOS" = "windows" ]; then
            (cd dist && zip "$ARCHIVE" "${FILES[@]}")
          else
            (cd dist && tar -czf "$ARCHIVE" "${FILES[@]}")
          fi
          checksum() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1"
            else
              shasum -a 256 "$1"
            fi
          }
          checksum "dist/$BINARY" > "dist/$BINARY.sha256"
          checksum "dist/$WEBUI_BINARY" > "dist/$WEBUI_BINARY.sha256"
          if [ -n "$DOWNLOADER_BINARY" ]; then
            checksum "dist/$DOWNLOADER_BINARY" > "dist/$DOWNLOADER_BINARY.sha256"
          fi
          if [ -n "$VLLM_BINARY" ]; then
            checksum "dist/$VLLM_BINARY" > "dist/$VLLM_BINARY.sha256"
          fi
          checksum "dist/$ARCHIVE" > "dist/$ARCHIVE.sha256"

      - name: Verify archive executable boundary
        env:
          GOOS: ${{ matrix.target.goos }}
          VLLM_BINARY: ${{ matrix.target.vllm_binary }}
          ARCHIVE: ${{ matrix.target.archive }}
        run: |
          if [ "$GOOS" = "windows" ]; then
            CONTENTS="$(cd dist && unzip -Z1 "$ARCHIVE")"
          else
            CONTENTS="$(cd dist && tar -tzf "$ARCHIVE")"
          fi
          if [ -n "$VLLM_BINARY" ]; then
            grep -Fxq "$VLLM_BINARY" <<<"$CONTENTS"
          elif grep -Eq '(^|/)tensor-router-vllm([.-]|$)' <<<"$CONTENTS"; then
            echo "unsupported archive contains tensor-router-vllm" >&2
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tensors-router-${{ matrix.target.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  containers:
    name: Validate container deployment manifests
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Validate container deployment manifests
        env:
          TENSORS_ROUTER_ROOT: /srv/tensors-router
          TENSORS_ROUTER_MODELS_PATH: /srv/tensors-models
          TENSORS_ROUTER_INFERENCE_TOKEN: ci-inference-validation-token
          TENSORS_ROUTER_ADMIN_TOKEN: ci-admin-validation-token
          TENSORS_ROUTER_CLUSTER_TOKEN: ci-cluster-validation-token
          TENSORS_ROUTER_WEBUI_ADMIN_TOKEN: ci-webui-validation-token
        run: |
          jq -e '.version == "2" and (.templates | length == 10)' deploy/portainer/templates.json
          jq -r '.templates[].repository.stackfile' deploy/portainer/templates.json | while IFS= read -r file; do
            test -f "$file" || exit 1
          done
          for file in deploy/portainer/*.yaml; do
            docker compose -f "$file" config >/dev/null
          done
          for profile in node webui; do
            docker compose -f deploy/compose.base.yaml --profile "$profile" config >/dev/null
            docker compose -f deploy/compose.base.yaml -f deploy/compose.cuda.yaml --profile "$profile" config >/dev/null
            docker compose -f deploy/compose.base.yaml -f deploy/compose.rocm.yaml --profile "$profile" config >/dev/null
            docker compose -f deploy/compose.base.yaml -f deploy/compose.vllm.yaml --profile "$profile" config >/dev/null
            docker compose -f deploy/compose.base.yaml -f deploy/compose.vllm-cuda.yaml --profile "$profile" config >/dev/null
            docker compose -f deploy/compose.base.yaml -f deploy/compose.vllm-rocm.yaml --profile "$profile" config >/dev/null
            docker compose -f deploy/compose.base.yaml -f deploy/compose.nvidia.yaml --profile "$profile" config >/dev/null
            docker compose -f deploy/compose.base.yaml -f deploy/compose.amd.yaml --profile "$profile" config >/dev/null
            docker compose -f deploy/compose.base.yaml -f deploy/compose.vllm.yaml -f deploy/compose.nvidia.yaml --profile "$profile" config >/dev/null
            docker compose -f deploy/compose.base.yaml -f deploy/compose.vllm.yaml -f deploy/compose.amd.yaml --profile "$profile" config >/dev/null
            docker compose -f deploy/compose.base.yaml -f deploy/compose.vllm.yaml -f deploy/compose.intel.yaml --profile "$profile" config >/dev/null
          done
          bash scripts/test-container-release-gate.sh

  release:
    name: Publish release assets
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: [build, containers]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: release
          pattern: tensors-router-*
          merge-multiple: true

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          if gh release view "$RELEASE_TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG_NAME" release/* --clobber
          else
            gh release create "$RELEASE_TAG_NAME" release/* --generate-notes --title "$RELEASE_TAG_NAME" --target "$GITHUB_SHA"
          fi
  publish-containers:
    name: Publish container images
    if: github.event_name == 'release' && github.event.action == 'published' && !github.event.release.prerelease
    needs: [build, containers]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/containers.yml
    with:
      version: ${{ github.event.release.tag_name }}
      prerelease: ${{ github.event.release.prerelease }}

name: Publish container images

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GO_VERSION: "1.26.6"

jobs:
  publish:
    name: Publish tensors-router-${{ matrix.target }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: node
            file: Containerfile
            stage: node
          - target: webui
            file: Containerfile
            stage: webui
          - target: vllm-node
            file: Containerfile.vllm
            stage: vllm-node
          - target: vllm-webui
            file: Containerfile.vllm
            stage: vllm-webui
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Log in to GHCR
        uses: docker/login-action@465a07811f14bebb1938fbed4728c6a1ff8901fc
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image coordinates
        id: image
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          VERSION="$REQUESTED_VERSION"
          if [[ ! "$VERSION" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid container version: $VERSION" >&2
            exit 1
          fi
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/tensors-router-$TARGET" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build candidate
        id: candidate
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.stage }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:candidate-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
          build-args: |
            GO_VERSION=${{ env.GO_VERSION }}
            VERSION=${{ steps.image.outputs.version }}
            COMMIT=${{ github.sha }}

      - name: Scan candidate digest
        env:
          CANDIDATE: ${{ steps.image.outputs.name }}@${{ steps.candidate.outputs.digest }}
        shell: bash
        run: |
          for platform in linux/amd64 linux/arm64; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$HOME/.docker:/root/.docker:ro" aquasec/trivy@sha256:a22415a38938a56c379387a8163fcb0ce38b10ace73e593475d3658d578b2436 image --platform "$platform" --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL "$CANDIDATE"
          done

      - name: Promote scanned digest
        env:
          CANDIDATE: ${{ steps.image.outputs.name }}@${{ steps.candidate.outputs.digest }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_VERSION: ${{ steps.image.outputs.version }}
        shell: bash
        run: docker buildx imagetools create --tag "$IMAGE_NAME:$IMAGE_VERSION" --tag "$IMAGE_NAME:latest" "$CANDIDATE"

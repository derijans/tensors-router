name: Publish container images

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      prerelease:
        required: true
        type: boolean

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  gate:
    name: Validate stable release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Validate release event and version
        env:
          PRERELEASE: ${{ inputs.prerelease }}
          VERSION: ${{ inputs.version }}
        run: bash scripts/validate-container-release.sh "$GITHUB_EVENT_NAME" "${{ github.event.action }}" "$PRERELEASE" "$VERSION"

  build:
    name: Build candidate tensors-router-${{ matrix.target }}
    runs-on: ubuntu-latest
    needs: gate
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - node
          - webui
          - vllm-node
          - vllm-webui
          - node-cuda
          - webui-cuda
          - vllm-node-cuda
          - vllm-webui-cuda
          - node-rocm
          - webui-rocm
          - vllm-node-rocm
          - vllm-webui-rocm
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Log in to GHCR
        uses: docker/login-action@465a07811f14bebb1938fbed4728c6a1ff8901fc
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve candidate coordinates
        id: image
        env:
          TARGET: ${{ matrix.target }}
        run: |
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}/tensors-router-$TARGET"
          platforms=linux/amd64,linux/arm64
          [[ "$TARGET" != *-rocm ]] || platforms=linux/amd64
          echo "name=$image_name" >> "$GITHUB_OUTPUT"
          echo "platforms=$platforms" >> "$GITHUB_OUTPUT"

      - name: Build and push candidate
        id: candidate
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          file: Containerfile
          target: ${{ matrix.target }}
          platforms: ${{ steps.image.outputs.platforms }}
          push: true
          tags: ${{ steps.image.outputs.name }}:candidate-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.version }}
          build-args: |
            VERSION=${{ inputs.version }}
            COMMIT=${{ github.sha }}

      - name: Record candidate digest
        env:
          DIGEST: ${{ steps.candidate.outputs.digest }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p container-digests
          printf '%s@%s\n' "$IMAGE_NAME" "$DIGEST" > "container-digests/$TARGET"

      - name: Upload candidate digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: container-digest-${{ matrix.target }}
          path: container-digests/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 1

  verify:
    name: Verify candidate tensors-router-${{ matrix.target }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - node
          - webui
          - vllm-node
          - vllm-webui
          - node-cuda
          - webui-cuda
          - vllm-node-cuda
          - vllm-webui-cuda
          - node-rocm
          - webui-rocm
          - vllm-node-rocm
          - vllm-webui-rocm
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Log in to GHCR
        uses: docker/login-action@465a07811f14bebb1938fbed4728c6a1ff8901fc
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download candidate digest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: container-digest-${{ matrix.target }}
          path: container-digests

      - name: Verify boundaries and accelerator linkage
        env:
          TARGET: ${{ matrix.target }}
        run: |
          candidate=$(cat "container-digests/$TARGET")
          image_name=${candidate%@*}
          platforms=(linux/amd64 linux/arm64)
          [[ "$TARGET" != *-rocm ]] || platforms=(linux/amd64)
          for platform in "${platforms[@]}"; do
            platform_digest=$(docker buildx imagetools inspect --raw "$candidate" | jq -er --arg os "${platform%%/*}" --arg architecture "${platform##*/}" '[.manifests[] | select(.platform.os == $os and .platform.architecture == $architecture) | .digest] | if length == 1 then .[0] else error("expected exactly one \($os)/\($architecture) manifest") end')
            image="$image_name@$platform_digest"
            docker pull --platform "$platform" "$image"
            test "$(docker image inspect "$image" --format '{{.Config.User}}')" = tensors
            if [[ "$TARGET" == *webui* ]]; then
              docker image inspect "$image" --format '{{json .Config.ExposedPorts}}' | jq -e 'keys == ["8080/tcp", "8443/tcp", "8444/tcp"]'
              docker image inspect "$image" --format '{{json .Config.Entrypoint}}' | jq -e '. == ["tensor-router-webui", "--config", "/config/webui.yaml"]'
            else
              docker image inspect "$image" --format '{{json .Config.ExposedPorts}}' | jq -e 'keys == ["8080/tcp"]'
              docker image inspect "$image" --format '{{json .Config.Entrypoint}}' | jq -e '. == ["tensors-router", "serve", "--config", "/config/config.yaml"]'
            fi
            banned_tools="pip gcc g++ cc make cmake nvcc"
            [[ "$TARGET" == *-rocm ]] || banned_tools="$banned_tools hipcc clang"
            docker run --rm --platform "$platform" -e BANNED_TOOLS="$banned_tools" --entrypoint /bin/sh "$image" -c '
              set -e
              test -x /usr/local/bin/tensors-router || { echo "verify: missing /usr/local/bin/tensors-router"; exit 1; }
              test -x /usr/local/bin/tensor-router-downloader || { echo "verify: missing /usr/local/bin/tensor-router-downloader"; exit 1; }
              ids="$(id -u tensors):$(id -g tensors)"
              [ "$ids" = 10001:10001 ] || { echo "verify: unexpected tensors uid:gid $ids"; exit 1; }
              data_owner="$(stat -c %u:%g /data)"
              [ "$data_owner" = 10001:10001 ] || { echo "verify: unexpected /data ownership $data_owner"; exit 1; }
              models_owner="$(stat -c %u:%g /models)"
              [ "$models_owner" = 10001:10001 ] || { echo "verify: unexpected /models ownership $models_owner"; exit 1; }
              for tool in $BANNED_TOOLS; do
                found="$(command -v "$tool" 2>/dev/null || true)"
                [ -z "$found" ] || { echo "verify: unexpected $tool at $found"; exit 1; }
              done
            '
            if [[ "$TARGET" == *webui* ]]; then
              docker run --rm --platform "$platform" --entrypoint /bin/sh "$image" -c 'test -x /usr/local/bin/tensor-router-webui'
            else
              docker run --rm --platform "$platform" --entrypoint /bin/sh "$image" -c 'test ! -e /usr/local/bin/tensor-router-webui'
            fi
            if [[ "$TARGET" == vllm-* ]]; then
              docker image inspect "$image" --format '{{json .Config.Volumes}}' | jq -e 'keys == ["/data/vllm", "/models"]'
              docker run --rm --platform "$platform" --entrypoint /bin/sh "$image" -c 'test -x /usr/local/bin/tensor-router-vllm'
            else
              docker run --rm --platform "$platform" --entrypoint /bin/sh "$image" -c 'test ! -e /usr/local/bin/tensor-router-vllm'
            fi
            if [[ "$TARGET" == *-cuda ]]; then
              docker run --rm --platform "$platform" --entrypoint /bin/sh "$image" -c "ldconfig -p | grep -q 'libcudart\.so' && ldconfig -p | grep -q 'libcublas\.so'"
              docker image inspect "$image" --format '{{json .Config.Env}}' | jq -e 'index("NVIDIA_VISIBLE_DEVICES=all") and index("NVIDIA_DRIVER_CAPABILITIES=compute,utility")'
            fi
            if [[ "$TARGET" == *-rocm ]]; then
              docker run --rm --platform "$platform" --entrypoint /bin/sh "$image" -c "ldconfig -p | grep -q 'libamdhip64\.so' && ldconfig -p | grep -q 'librocblas\.so'"
            fi
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$HOME/.docker:/root/.docker:ro" aquasec/trivy@sha256:a22415a38938a56c379387a8163fcb0ce38b10ace73e593475d3658d578b2436 image --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL "$image"
          done

  promote:
    name: Promote verified container set
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Log in to GHCR
        uses: docker/login-action@465a07811f14bebb1938fbed4728c6a1ff8901fc
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all candidate digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: container-digest-*
          path: container-digests
          merge-multiple: true

      - name: Promote release manifests
        env:
          VERSION: ${{ inputs.version }}
        run: |
          test "$(find container-digests -type f | wc -l)" -eq 12
          while IFS= read -r digest_file; do
            candidate=$(cat "$digest_file")
            image_name=${candidate%@*}
            docker buildx imagetools create --tag "$image_name:$VERSION" --tag "$image_name:latest" "$candidate"
          done < <(find container-digests -type f -print | sort)

  cleanup:
    name: Remove candidate-only packages
    runs-on: ubuntu-latest
    needs: [build, verify, promote]
    if: always()
    permissions:
      contents: read
      packages: write
    steps:
      - name: Delete candidate-only package versions
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          CANDIDATE_TAG: candidate-${{ github.sha }}
        run: |
          for target in node webui vllm-node vllm-webui node-cuda webui-cuda vllm-node-cuda vllm-webui-cuda node-rocm webui-rocm vllm-node-rocm vllm-webui-rocm; do
            package=$(jq -rn --arg name "tensors-router/tensors-router-$target" '$name | @uri')
            versions=$(gh api --paginate "/users/$OWNER/packages/container/$package/versions?per_page=100" 2>/dev/null | jq -s 'flatten(1)') || continue
            while IFS= read -r version_id; do
              [[ -n "$version_id" ]] || continue
              echo "deleting candidate-only version $version_id of tensors-router-$target"
              gh api --method DELETE "/users/$OWNER/packages/container/$package/versions/$version_id" >/dev/null 2>&1 ||                 gh api --method DELETE "/user/packages/container/$package/versions/$version_id" >/dev/null 2>&1 ||                 echo "could not delete version $version_id; a token with delete:packages is required"
            done < <(jq -r '.[] | select([.metadata.container.tags[]? | startswith("candidate-")] | length > 0 and all) | .id' <<<"$versions")
          done

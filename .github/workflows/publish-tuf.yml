name: Publish trusted update metadata
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      vllm_evidence_run_id:
        description: Successful approved hardware-profile validation run to publish; empty preserves current vLLM manifests
        required: false
        type: string
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: tuf-publication
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: tuf-metadata
          path: published
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: go.mod
      - name: Authorize vLLM profile evidence run
        if: inputs.vllm_evidence_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_RUN_ID: ${{ inputs.vllm_evidence_run_id }}
          EXPECTED_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          [[ "$EVIDENCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          mkdir -p .tmp
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$EVIDENCE_RUN_ID" > .tmp/vllm-evidence-run.json
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$EXPECTED_COMMIT" \
            '.conclusion == "success" and .event == "workflow_dispatch" and .path == ".github/workflows/vllm-profile-evidence.yml" and .head_sha == $commit and .head_repository.full_name == $repository' \
            .tmp/vllm-evidence-run.json >/dev/null
      - name: Download vLLM profile evidence
        if: inputs.vllm_evidence_run_id != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: vllm-runtime-profile-evidence
          path: .tmp/vllm-runtime-profile-evidence
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.vllm_evidence_run_id }}
      - name: Build signed publication
        env:
          TUF_UPSTREAM_TARGETS_KEY: ${{ secrets.TUF_UPSTREAM_TARGETS_KEY }}
          TUF_SNAPSHOT_KEY: ${{ secrets.TUF_SNAPSHOT_KEY }}
          TUF_TIMESTAMP_KEY: ${{ secrets.TUF_TIMESTAMP_KEY }}
          VLLM_EVIDENCE_RUN_ID: ${{ inputs.vllm_evidence_run_id }}
          SOURCE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          repository=published/tuf
          rotation=tuf/rotations/2.targets.json
          current_version="$(jq -er '.signed.version' "$repository/metadata/targets.json")"
          rotation_version="$(jq -er '.signed.version' "$rotation")"
          if (( rotation_version == current_version + 1 )); then
            go run ./cmd/tensor-router-tuf-targets-rotation install \
              -repository "$repository" \
              -signed-targets "$rotation" \
              -output .tmp/tuf-rotation-staged
            repository=.tmp/tuf-rotation-staged
          elif (( rotation_version == current_version )); then
            jq -e --slurp '.[0].signed == .[1].signed' "$repository/metadata/targets.json" "$rotation" >/dev/null
          elif (( rotation_version > current_version )); then
            echo "Targets rotation version $rotation_version cannot follow published version $current_version" >&2
            exit 1
          fi
          arguments=(-repository "$repository" -output .tmp/tuf-publication)
          if [[ -n "$VLLM_EVIDENCE_RUN_ID" ]]; then
            arguments+=(-runtime-evidence .tmp/vllm-runtime-profile-evidence -source-commit "$SOURCE_COMMIT")
          fi
          go run ./cmd/tensor-router-tuf-publisher "${arguments[@]}"
      - name: Replace publication
        shell: bash
        run: |
          find published -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          mkdir -p published/tuf
          cp -a .tmp/tuf-publication/. published/tuf/
          cp tuf/index.html published/index.html
          touch published/.nojekyll
      - name: Push publication
        working-directory: published
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          git diff --cached --quiet && exit 0
          git commit -m "updates: publish trusted metadata"
          git push origin HEAD:tuf-metadata

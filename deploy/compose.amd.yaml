x-tensors-router-deprecated: "Use compose.rocm.yaml or compose.vllm-rocm.yaml for images with the ROCm user-space runtime."

services:
  router-node:
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add: ["video", "render"]

  router-webui:
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add: ["video", "render"]

name: tensors-router-webui

services:
  router-webui:
    image: "${TENSORS_ROUTER_WEBUI_IMAGE:-ghcr.io/derijans/tensors-router/tensors-router-webui:latest}"
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 16m30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: ["gpu"]
    environment:
      TENSORS_ROUTER_INFERENCE_TOKEN: "${TENSORS_ROUTER_INFERENCE_TOKEN:?Set TENSORS_ROUTER_INFERENCE_TOKEN}"
      TENSORS_ROUTER_ADMIN_TOKEN: "${TENSORS_ROUTER_ADMIN_TOKEN:?Set TENSORS_ROUTER_ADMIN_TOKEN}"
      TENSORS_ROUTER_CLUSTER_TOKEN: "${TENSORS_ROUTER_CLUSTER_TOKEN:?Set TENSORS_ROUTER_CLUSTER_TOKEN}"
      TENSORS_ROUTER_WEBUI_ADMIN_TOKEN: "${TENSORS_ROUTER_WEBUI_ADMIN_TOKEN:?Set TENSORS_ROUTER_WEBUI_ADMIN_TOKEN}"
      TENSORS_ROUTER_MANAGED_ROUTER_TOKEN: "${TENSORS_ROUTER_ADMIN_TOKEN:?Set TENSORS_ROUTER_ADMIN_TOKEN}"
    ports:
      - "8443:8443"
      - "8444:8444"
    volumes:
      - "${TENSORS_ROUTER_ROOT:?Set TENSORS_ROUTER_ROOT}/config/router-managed.yaml:/config/config.yaml:ro"
      - "${TENSORS_ROUTER_ROOT:?Set TENSORS_ROUTER_ROOT}/config/downloader.yaml:/config/downloader.yaml:ro"
      - "${TENSORS_ROUTER_ROOT:?Set TENSORS_ROUTER_ROOT}/config/webui.yaml:/config/webui.yaml:ro"
      - "${TENSORS_ROUTER_ROOT:?Set TENSORS_ROUTER_ROOT}/logs/downloader:/config/data"
      - "${TENSORS_ROUTER_ROOT:?Set TENSORS_ROUTER_ROOT}/kcpps:/kcpps"
      - "${TENSORS_ROUTER_MODELS_PATH:?Set TENSORS_ROUTER_MODELS_PATH}:/models"
      - "${TENSORS_ROUTER_ROOT:?Set TENSORS_ROUTER_ROOT}/logs:/logs"
      - "${TENSORS_ROUTER_ROOT:?Set TENSORS_ROUTER_ROOT}/backends:/backends"
      - "webui-data:/data"
    tmpfs:
      - /tmp:size=64m,mode=1777

volumes:
  webui-data:
